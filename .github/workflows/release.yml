name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 or 0.2.0-beta.1 (blank uses source version; no automatic increment)"
        type: string
        required: false
        default: ""
      draft:
        description: "Create a draft release (uncheck to publish after both platforms pass)"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source_version: ${{ steps.metadata.outputs.source_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select and apply the release version
        id: metadata
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: node scripts/release-package.mjs prepare
      - name: Require a new release tag
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          existing="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$existing" ]]; then
            echo "::error::The version tag already exists. Enter a new release version."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux-x64
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      # linuxdeploy's AppImage tools can run on hosted runners without a FUSE mount.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      RELEASE_VERSION_INPUT: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install Linux desktop and bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl wget file patchelf libssl-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply the selected version to this build workspace
        run: node scripts/release-package.mjs prepare
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: release-${{ matrix.platform }}
      - run: npm ci
      - name: Check application and packaging contracts
        run: npm run check
      - run: npm run test:packaging
      - run: npm run test:release
      - name: Exercise standalone API and MCP runtime
        run: npm run test:runtime
      - name: Check native behavior
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build release installers with fresh verified runtime resources
        run: npm run tauri -w @atris-share/desktop -- build --ci --no-sign --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify runtime and collect installers with SHA-256 checksums
        run: node scripts/release-package.mjs collect ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: release-artifacts/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DRAFT_RELEASE: ${{ inputs.draft }}
      RELEASE_VERSION_INPUT: ${{ needs.prepare.outputs.version }}
      SOURCE_VERSION: ${{ needs.prepare.outputs.source_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-artifacts/combined
      - name: Apply release metadata and record reproducible source/version provenance
        run: |
          node scripts/release-package.mjs prepare
          node scripts/release-package.mjs finalize release-artifacts/combined
      - name: Create release from the source commit and selected version
        shell: bash
        run: |
          flags=()
          if [[ "$DRAFT_RELEASE" == "true" ]]; then flags+=(--draft); fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          gh release create "$RELEASE_TAG" release-artifacts/combined/* \
            --repo "$GH_REPO" --verify-tag \
            --title "AtrisShare $RELEASE_VERSION" --generate-notes "${flags[@]}"
