name: Workspace checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node --test tests/packaging.test.mjs
      - run: npm run check
      - run: npm run test:runtime
      - run: node scripts/package-inventory.mjs --verify apps/desktop/src-tauri/runtime

  windows-package:
    name: Windows native and unsigned NSIS staging (no publication)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build:core
      - run: npm run stage:runtime
      - run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      # Tauri's pre-build hook builds the UI and stages fresh, verified resources.
      # No signing credentials, updater keys, release action, or repository writes.
      - run: npm run tauri -w @atris-share/desktop -- build --ci --no-sign --bundles nsis -- --locked
      - run: node scripts/package-inventory.mjs --verify apps/desktop/src-tauri/runtime
      - run: node --test tests/packaging.test.mjs tests/runtime.test.mjs
      - name: Require the NSIS artifact
        shell: pwsh
        run: |
          if (!(Test-Path -Path "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe")) {
            throw "Unsigned NSIS staging artifact is missing"
          }
      - name: Keep unsigned staging evidence, not a release
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-package-staging
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/runtime/manifest.json
            apps/desktop/src-tauri/runtime/dependency-inventory.json
            apps/desktop/src-tauri/runtime/*LICENSE*.txt
            apps/desktop/src-tauri/runtime/*NOTICE*.txt
