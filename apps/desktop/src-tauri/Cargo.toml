[package]
name = "atris-share"
version = "0.1.0-preview.1"
description = "AtrisShare local desktop workspace"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "atris_share_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
